name: Sample Project Upload
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**/*--sample-projects/**'

permissions:
  contents: read

jobs:
  upload:
    uses: doplaydo/pdk-ci-workflow-public/.github/workflows/sample-project-upload.yml@main
    secrets:
      GFP_API_KEY: ${{ secrets.GFP_API_KEY }}
      # Syncs mapped sample projects to doplaydo/gfp-sample-projects (optional).
      GSP_SYNC_TOKEN: ${{ secrets.GSP_SYNC_TOKEN }}
